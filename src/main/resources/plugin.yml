name: MythicMagicFind
version: ${version}
main: com.eisiadev.enceladus.magicfind.MythicMagicFind
api-version: 1.20
author: YourName
depend: [MythicMobs, Skript]
description: MythicMobs drop modifier with Magic Find system

commands:
  magicfind:
    description: Magic Find command
    usage: /magicfind reload
    permission: magicfind.admin
  mfnotify:
    description: Toggle magic find notifications
    usage: |
      /<command> list - Show all notification settings
      /<command> toggle <tier> - Toggle a specific tier
      /<command> enable <tier|all> - Enable notifications
      /<command> disable <tier|all> - Disable notifications
    aliases: [mfn, magicfindnotify]

permissions:
  magicfind.admin:
    description: Admin permission for Magic Find
    default: op